<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos de cafetería</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="../js/pedidos.js" defer></script>
</head>
<body class="bg-light">
    <main class="container py-4">
        <h1 class="mb-4">Pedidos de cafetería</h1>

        <form id="formPedido" class="card card-body mb-4">
            <h2 class="h4 mb-3">Registrar pedido</h2>

            <div class="mb-3">
                <label for="producto" class="form-label">
                    Nombre del producto
                </label>
                <input
                    type="text"
                    id="producto"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="precio" class="form-label">
                    Precio unitario ($)
                </label>
                <input
                    type="number"
                    id="precio"
                    class="form-control"
                    min="0.01"
                    step="0.01"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="cantidad" class="form-label">
                    Cantidad
                </label>
                <input
                    type="number"
                    id="cantidad"
                    class="form-control"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Agregar pedido
            </button>
        </form>

        <div class="card card-body mb-4">
            <label for="precioMaximo" class="form-label">
                Precio unitario máximo ($)
            </label>

            <input
                type="number"
                id="precioMaximo"
                class="form-control mb-3"
                min="0"
                step="0.01"
            >

            <div class="d-flex flex-wrap gap-2">
                <button
                    type="button"
                    id="btnFiltrar"
                    class="btn btn-secondary"
                >
                    Filtrar productos
                </button>

                <button
                    type="button"
                    id="btnMostrar"
                    class="btn btn-outline-secondary"
                >
                    Mostrar todos
                </button>

                <button
                    type="button"
                    id="btnLimpiar"
                    class="btn btn-outline-danger"
                >
                    Limpiar pedidos
                </button>
            </div>
        </div>

        <h2 class="h4">Pedidos registrados</h2>
        <p id="estadoVista" class="text-secondary"></p>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Producto</th>
                        <th scope="col">Precio unitario</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Subtotal</th>
                    </tr>
                </thead>

                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>

        <div class="card card-body mb-4">
            <h2 class="h5">Totales de todos los pedidos</h2>

            <p>
                Unidades solicitadas:
                <strong id="totalUnidades">0</strong>
            </p>

            <p class="mb-0">
                Monto total:
                $<strong id="montoTotal">0.00</strong>
            </p>
        </div>

        <a href="../index.html" class="btn btn-dark">Regresar</a>
    </main>
</body>
</html>
